name: Build APK Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Executar testes unitários antes de compilar o APK Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_version: ${{ steps.version.outputs.version_name }}
      apk_sha256: ${{ steps.package_apk.outputs.sha256 }}
      signing_mode: ${{ steps.signing.outputs.mode }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK e licenças (sdkmanager)
        id: android_sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK não encontrado em '$SDK_ROOT'."
            exit 1
          fi

          if [ ! -w "$SDK_ROOT" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
          fi

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado ou sem permissão de execução em '$SDK_ROOT/cmdline-tools'."
            exit 1
          fi

          SDKMANAGER_BIN_DIR="$(dirname "$SDKMANAGER")"
          echo "Usando Android SDK em: $SDK_ROOT"
          echo "Usando sdkmanager: $SDKMANAGER (versão $("$SDKMANAGER" --version))"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDKMANAGER_BIN_DIR}" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "${SDK_ROOT}/licenses"

          # Aceitar licenças sem usar '|| true' para não mascarar falhas reais do sdkmanager
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          if [ ! -f "${SDK_ROOT}/licenses/android-sdk-license" ]; then
            echo "::error::Falha ao registrar a licença padrão android-sdk-license em ${SDK_ROOT}/licenses."
            exit 1
          fi

          # Instalar somente os pacotes necessários para compileSdk 36.1, targetSdk 36 e Robolectric
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36.1" \
            "platforms;android-36"

          echo "Pacotes instalados no Android SDK:"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Configurar Gradle 9.3.1 e cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Definir versão do aplicativo
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${RAW_TAG#v}"
            if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            else
              VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
            fi
            echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "gradle_args=-PappVersionName=${VERSION_NAME} -PappVersionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.0" >> "$GITHUB_OUTPUT"
            echo "version_code=1" >> "$GITHUB_OUTPUT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar testes unitários e Robolectric
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Configurar assinatura Release (Secrets ou chave temporária de teste)
        id: signing
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
            printf '%s' "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASS" -alias upload >/dev/null 2>&1; then
              echo "::error::A keystore configurada nos GitHub Secrets precisa conter o alias 'upload' (conforme app/build.gradle.kts)."
              exit 1
            fi

            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASS}" >> "$GITHUB_ENV"
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "Assinatura de produção configurada com sucesso via GitHub Secrets."
          else
            KEYSTORE_FILE="${RUNNER_TEMP}/test-release-keystore.jks"
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::${EPHEMERAL_PASS}"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=BPS Facilities Test Release, OU=TI, O=BPS Facilities, L=Sao Paulo, S=SP, C=BR"

            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "mode=ephemeral-test" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de assinatura não configurados (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD). Gerado APK Release assinado com chave temporária apenas para testes."
          fi

      - name: Compilar APK em modo Release
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace ${{ steps.version.outputs.gradle_args }}
          else
            gradle :app:assembleRelease --no-daemon --stacktrace ${{ steps.version.outputs.gradle_args }}
          fi

      - name: Localizar, validar assinatura e renomear APK
        id: package_apk
        shell: bash
        run: |
          APK_SOURCE=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Nenhum APK Release foi encontrado em app/build/outputs/apk/release/."
            exit 1
          fi

          mkdir -p build-artifacts
          cp "$APK_SOURCE" "build-artifacts/Passagem-de-Ponto.apk"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER_BIN=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER_BIN="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi

          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Verificando assinatura com $APKSIGNER_BIN..."
            "$APKSIGNER_BIN" verify --print-certs "build-artifacts/Passagem-de-Ponto.apk"
          fi

          APK_SIZE="$(du -h build-artifacts/Passagem-de-Ponto.apk | cut -f1)"
          APK_SHA256="$(sha256sum build-artifacts/Passagem-de-Ponto.apk | awk '{print $1}')"
          echo "size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "APK gerado: build-artifacts/Passagem-de-Ponto.apk (${APK_SIZE}) | SHA-256: ${APK_SHA256}"

      - name: Publicar APK como Artifact do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK-Passagem-de-Ponto
          path: build-artifacts/Passagem-de-Ponto.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remover chave temporária do runner
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/release-keystore.jks" "${RUNNER_TEMP}/test-release-keystore.jks"

      - name: Exibir resumo da compilação
        if: always()
        shell: bash
        run: |
          {
            echo "## Resultado da Compilação Android (Release)"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| **Status do Job** | ${{ job.status }} |"
            echo "| **Application ID** | \`com.aistudio.bpsfacilities.vjkr\` |"
            echo "| **Versão** | \`${{ steps.version.outputs.version_name }}\` (code \`${{ steps.version.outputs.version_code }}\`) |"
            echo "| **Arquivo** | \`Passagem-de-Ponto.apk\` |"
            echo "| **Artifact** | \`APK-Passagem-de-Ponto\` (retenção de 30 dias) |"
            echo "| **Tamanho** | \`${{ steps.package_apk.outputs.size }}\` |"
            echo "| **SHA-256** | \`${{ steps.package_apk.outputs.sha256 }}\` |"
            echo "| **Assinatura** | \`${{ steps.signing.outputs.mode }}\` |"
            echo ""
            if [ "${{ steps.signing.outputs.mode }}" = "ephemeral-test" ]; then
              echo "> **Aviso:** O APK foi assinado com uma chave temporária de teste porque os GitHub Secrets de assinatura ainda não estão configurados."
            else
              echo "> **Assinatura de Produção:** O APK foi assinado utilizando a keystore configurada nos GitHub Secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publicar APK no GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Artifact do APK compilado
        uses: actions/download-artifact@v4
        with:
          name: APK-Passagem-de-Ponto
          path: release-assets

      - name: Validar arquivo APK antes da publicação
        shell: bash
        run: |
          if [ ! -f "release-assets/Passagem-de-Ponto.apk" ]; then
            echo "::error::Artifact Passagem-de-Ponto.apk não encontrado para publicação da Release."
            exit 1
          fi
          ls -lh release-assets/Passagem-de-Ponto.apk

      - name: Criar ou atualizar Release sem duplicação
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} já existe; atualizando apenas o anexo Passagem-de-Ponto.apk sem criar duplicata."
            gh release upload "$TAG_NAME" "release-assets/Passagem-de-Ponto.apk" --clobber
          else
            NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
            {
              echo "## BPS Facilities — Passagem de Posto (${TAG_NAME})"
              echo ""
              echo "- **Arquivo:** \`Passagem-de-Ponto.apk\`"
              echo "- **Application ID:** \`com.aistudio.bpsfacilities.vjkr\`"
              echo "- **SHA-256:** \`${APK_SHA256}\`"
              echo "- **Modo de assinatura:** \`${SIGNING_MODE}\`"
            } > "$NOTES_FILE"

            gh release create "$TAG_NAME" "release-assets/Passagem-de-Ponto.apk" \
              --title "BPS Facilities ${TAG_NAME}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
