name: Build APK Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Executar testes unitários antes de compilar o APK Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_version: ${{ steps.version.outputs.version_name }}
      apk_sha256: ${{ steps.package_apk.outputs.sha256 }}
      signing_mode: ${{ steps.signing.outputs.mode }}

    steps:
      # Etapa 1: Checkout do repositório
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4

      # Etapa 2: Configurar JDK 21 (Temurin)
      - name: 2. Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Etapa 3: Configurar Android SDK e licenças
      - name: 3. Configurar Android SDK e licenças (sdkmanager)
        id: android_sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK não encontrado em '$SDK_ROOT'."
            exit 1
          fi

          if [ ! -w "$SDK_ROOT" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
          fi

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado ou sem permissão de execução em '$SDK_ROOT/cmdline-tools'."
            exit 1
          fi

          SDKMANAGER_BIN_DIR="$(dirname "$SDKMANAGER")"
          echo "Usando Android SDK em: $SDK_ROOT"
          echo "Usando sdkmanager: $SDKMANAGER (versão $("$SDKMANAGER" --version))"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDKMANAGER_BIN_DIR}" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "${SDK_ROOT}/licenses"

          # Aceitar licenças sem mascarar falhas reais do sdkmanager
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          if [ ! -f "${SDK_ROOT}/licenses/android-sdk-license" ]; then
            echo "::error::Falha ao registrar a licença padrão android-sdk-license em ${SDK_ROOT}/licenses."
            exit 1
          fi

          # Instalar pacotes necessários para compileSdk 36.1, targetSdk 36 e Robolectric
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36.1" \
            "platforms;android-36"

          echo "Pacotes instalados no Android SDK:"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      # Etapa 4: Configurar Gradle 9.3.1 e cache
      - name: 4. Configurar Gradle 9.3.1 e cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Etapa 5: Tornar gradlew executável (se existir) e garantir debug.keystore
      - name: 5. Tornar gradlew executável (se existir) e preparar debug.keystore
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Permissão de execução concedida a ./gradlew"
          else
            echo "Gradle wrapper não presente no repositório; o runner utilizará o Gradle instalado."
          fi

          if [ ! -f "./debug.keystore" ] && [ -f "./debug.keystore.base64" ]; then
            base64 --decode "./debug.keystore.base64" > "./debug.keystore"
            echo "debug.keystore restaurada a partir de debug.keystore.base64 para validação da variante Debug."
          fi

      # Etapa 6: Gerar versão automática (versionName e versionCode)
      - name: 6. Gerar versão automática (versionName e versionCode)
        id: version
        shell: bash
        run: |
          RUN_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          VERSION_CODE="$((10 + RUN_NUMBER))"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${RAW_TAG#v}"
          else
            VERSION_NAME="1.1.${RUN_NUMBER}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "run_number=${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "gradle_args=-PappVersionName=${VERSION_NAME} -PappVersionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Versão automática configurada: versionName=${VERSION_NAME}, versionCode=${VERSION_CODE} (Execução #${RUN_NUMBER})"

      # Etapa 7: Executar validação KSP e testes unitários
      - name: 7. Executar validação KSP e testes unitários (JVM Headless)
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:kspDebugKotlin :app:kspDebugUnitTestKotlin :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:kspDebugKotlin :app:kspDebugUnitTestKotlin :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Publicar relatório de testes unitários em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      # Etapa 8: Configurar assinatura Release (keystore de produção ou temporária segura)
      - name: 8. Configurar assinatura Release (Secrets ou chave temporária segura)
        id: signing
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
            printf '%s' "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASS" -alias upload >/dev/null 2>&1; then
              echo "::error::A keystore configurada nos GitHub Secrets precisa conter o alias 'upload' (conforme app/build.gradle.kts)."
              exit 1
            fi

            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASS}" >> "$GITHUB_ENV"
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "Assinatura de produção configurada com sucesso via GitHub Secrets."
          else
            KEYSTORE_FILE="${RUNNER_TEMP}/test-release-keystore.jks"
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::${EPHEMERAL_PASS}"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=BPS Facilities Test Release, OU=TI, O=BPS Facilities, L=Sao Paulo, S=SP, C=BR"

            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "mode=ephemeral-test" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de assinatura não configurados (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD). Gerado APK Release assinado com chave temporária apenas para testes."
          fi

      # Etapa 9: Compilar APK Release (:app:assembleRelease)
      - name: 9. Compilar APK Release (:app:assembleRelease)
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace ${{ steps.version.outputs.gradle_args }}
          else
            gradle :app:assembleRelease --no-daemon --stacktrace ${{ steps.version.outputs.gradle_args }}
          fi

      # Etapa 10, 11, 12, 13: Localizar, validar assinatura, renomear e calcular hashes
      - name: 10-13. Localizar, validar com apksigner, renomear e calcular SHA-256
        id: package_apk
        shell: bash
        run: |
          # Etapa 10: Localizar o APK gerado
          APK_SOURCE=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Nenhum APK Release foi encontrado em app/build/outputs/apk/release/."
            exit 1
          fi

          mkdir -p build-artifacts
          # Etapa 12: Renomear para BPS-FACILITIES-Release.apk
          cp "$APK_SOURCE" "build-artifacts/BPS-FACILITIES-Release.apk"

          # Etapa 11: Validar integridade e assinatura do APK com apksigner
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER_BIN=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER_BIN="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi

          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Validando assinatura com $APKSIGNER_BIN..."
            "$APKSIGNER_BIN" verify --print-certs "build-artifacts/BPS-FACILITIES-Release.apk"
          fi

          # Etapa 13: Calcular hash SHA-256 e tamanho
          APK_SIZE="$(du -h build-artifacts/BPS-FACILITIES-Release.apk | cut -f1)"
          APK_SHA256="$(sha256sum build-artifacts/BPS-FACILITIES-Release.apk | awk '{print $1}')"
          echo "size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "APK gerado com sucesso: build-artifacts/BPS-FACILITIES-Release.apk (${APK_SIZE})"
          echo "SHA-256: ${APK_SHA256}"

      # Etapa 14: Publicar APK como Artifact (nome: BPS-FACILITIES-Release)
      - name: 14. Publicar APK como Artifact (BPS-FACILITIES-Release)
        uses: actions/upload-artifact@v4
        with:
          name: BPS-FACILITIES-Release
          path: build-artifacts/BPS-FACILITIES-Release.apk
          retention-days: 30
          if-no-files-found: error

      # Etapa 15: Limpeza segura de credenciais e chaves do runner
      - name: 15. Limpeza segura de credenciais e chaves do runner
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/release-keystore.jks" "${RUNNER_TEMP}/test-release-keystore.jks"
          if [ -f "./debug.keystore" ] && [ -f "./debug.keystore.base64" ]; then
            rm -f "./debug.keystore"
          fi
          echo "Keystores temporárias removidas com segurança do runner."

      # Etapa 16: Gerar resumo detalhado no GitHub Step Summary
      - name: 16. Gerar resumo detalhado da compilação
        if: always()
        shell: bash
        run: |
          {
            echo "## 🛡️ BPS Facilities — Relatório de Compilação Release"
            echo ""
            echo "| Propriedade | Valor |"
            echo "| --- | --- |"
            echo "| **Status da Execução** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |"
            echo "| **Build Actions** | #${{ steps.version.outputs.run_number }} |"
            echo "| **Identificador (App ID)** | \`com.aistudio.bpsfacilities.vjkr\` |"
            echo "| **Versão do Aplicativo** | \`${{ steps.version.outputs.version_name }}\` (versionCode: \`${{ steps.version.outputs.version_code }}\`) |"
            echo "| **Arquivo Gerado** | \`BPS-FACILITIES-Release.apk\` |"
            echo "| **Artefato Actions** | \`BPS-FACILITIES-Release\` (armazenado por 30 dias) |"
            echo "| **Tamanho do Arquivo** | \`${{ steps.package_apk.outputs.size }}\` |"
            echo "| **Hash SHA-256** | \`${{ steps.package_apk.outputs.sha256 }}\` |"
            echo "| **Modo de Assinatura** | \`${{ steps.signing.outputs.mode }}\` |"
            echo ""
            if [ "${{ steps.signing.outputs.mode }}" = "ephemeral-test" ]; then
              echo "> ⚠️ **Chave Temporária de Teste:** O APK foi assinado com keystore temporária gerada durante a compilação porque os Secrets (\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\` e \`ANDROID_KEY_PASSWORD\`) ainda não foram preenchidos no repositório. Para releases finais que suportem atualizações contínuas sobre o mesmo app sem reinstalação, configure os 3 secrets no GitHub."
            else
              echo "> 🔒 **Assinatura de Produção:** O APK foi assinado com a keystore permanente configurada nos Secrets do repositório."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Etapa 17: Publicação automática no GitHub Releases quando tag v* for enviada
  publish-release:
    name: 17. Publicar APK no GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar Artifact do APK compilado
        uses: actions/download-artifact@v4
        with:
          name: BPS-FACILITIES-Release
          path: release-assets

      - name: Validar arquivo APK antes da publicação
        shell: bash
        run: |
          if [ ! -f "release-assets/BPS-FACILITIES-Release.apk" ]; then
            echo "::error::Artifact BPS-FACILITIES-Release.apk não encontrado para publicação da Release."
            exit 1
          fi
          ls -lh release-assets/BPS-FACILITIES-Release.apk

      - name: Publicar nova Release sem sobrescrever versões anteriores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} já existe e foi preservada sem sobrescrita. Crie uma nova tag (ex.: v1.0.1) para publicar uma nova versão."
            exit 0
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## BPS Facilities — Passagem de Posto (${TAG_NAME})"
            echo ""
            echo "- **Arquivo:** \`BPS-FACILITIES-Release.apk\`"
            echo "- **Application ID:** \`com.aistudio.bpsfacilities.vjkr\`"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **Modo de assinatura:** \`${SIGNING_MODE}\`"
            echo "- **Nova aba Avisos de Moradores (Blocos A e B — 288 unidades)**"
            echo "- **Envio exclusivo de PDF pelo WhatsApp com avisos ativos integrados**"
            echo "- **Assinaturas nominais automáticas e armazenamento offline seguro**"
          } > "$NOTES_FILE"

          gh release create "$TAG_NAME" "release-assets/BPS-FACILITIES-Release.apk" \
            --title "BPS Facilities ${TAG_NAME}" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
